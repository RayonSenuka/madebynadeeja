<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reach Out · NADEEJA</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <div class="wrap">
      <nav id="site-nav"></nav>
      <main class="standalone-page">
        <h2>Reach Out</h2>
        <p class="sub">Sponsorships, collaborations or just a hello.</p>
        <div class="cgrid">
          <div class="box">
            <form id="contact-form">
              <label for="name">Your name</label>
              <input id="name" name="name" type="text" required>
              <label for="email">Your email</label>
              <input id="email" name="email" type="email" required>
              <label for="message">Message</label>
              <textarea id="message" name="message" required></textarea>
              <div class="btns">
                <button class="btn p" type="submit">Send message</button>
              </div>
              <p class="status" id="status"></p>
            </form>
          </div>
          <div class="box soc">
            <a href="mailto:@madebynadeeja.com">
              Email <span>@madebynadeeja.com</span>
            </a>
            <a href="#">YouTube <span>@madebynadeeja</span></a>
            <a href="#">Instagram <span>@madebynadeeja</span></a>
            <a href="#">TikTok <span>@madebynadeeja</span></a>
          </div>
        </div>
      </main>
      <footer id="site-footer"></footer>
    </div>
    <script src="js/layout.js"></script>
    <script src="js/contact.js"></script>
  </body>
</html>
